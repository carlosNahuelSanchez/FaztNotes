services:
  db:
    image: pgvector/pgvector:pg16
    container_name: nexonotes-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexonotes_db}
      POSTGRES_USER: ${POSTGRES_USER:-nexonotes_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexonotes_secure_pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexonotes_admin} -d ${POSTGRES_DB:-nexonotes_db}"]
      interval: 4s
      timeout: 5s
      retries: 15
      start_period: 15s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexonotes-backend
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexonotes_admin}:${POSTGRES_PASSWORD:-nexonotes_secure_pass}@db:5432/${POSTGRES_DB:-nexonotes_db}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      POSTGRES_DB: ${POSTGRES_DB:-nexonotes_db}
      POSTGRES_USER: ${POSTGRES_USER:-nexonotes_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexonotes_secure_pass}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      LLM_MODEL: ${LLM_MODEL:-gemini-3.5-flash-lite}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
    ports:
      - "${BACKEND_PORT:-8780}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 4s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexonotes-frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-3780}:80"
    depends_on:
      backend:
        condition: service_healthy

  # ponytail: same image, different entrypoint — zero extra build
  mcp:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexonotes-mcp
    restart: unless-stopped
    command: ["python", "-m", "app.mcp_server"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexonotes_admin}:${POSTGRES_PASSWORD:-nexonotes_secure_pass}@db:5432/${POSTGRES_DB:-nexonotes_db}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gemini-3.5-flash-lite}
    ports:
      - "8781:8781"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
